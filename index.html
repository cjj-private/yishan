<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>🌸 樱花校园：公主动起来了！</title>
    <style>
        body { margin: 0; background: #fff0f6; font-family: 'Arial', sans-serif; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
        
        /* 校园舞台 */
        #campus-scene { 
            width: 95%; max-width: 600px; height: 400px; 
            background: linear-gradient(180deg, #87CEEB 0%, #ffdee9 100%); 
            border: 8px solid #ff85a1; border-radius: 30px; 
            position: relative; margin: 10px; overflow: hidden;
        }

        /* 角色：增加了平滑移动的过渡效果 */
        #princess { 
            font-size: 80px; position: absolute; 
            bottom: 30px; left: 50px; 
            transition: left 0.2s, bottom 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28); 
            user-select: none;
        }

        /* 状态条 */
        .status-box { position: absolute; top: 15px; left: 15px; background: rgba(255,255,255,0.8); padding: 8px; border-radius: 12px; font-size: 14px; }
        
        /* 手机端控制按钮（如果没键盘也能玩） */
        .move-btns { display: flex; gap: 10px; margin-bottom: 10px; }
        .ctrl-btn { width: 60px; height: 60px; background: #ff85a1; color: white; border: none; border-radius: 50%; font-size: 24px; cursor: pointer; }

        .panel { background: white; padding: 10px; border-radius: 20px; width: 90%; display: flex; justify-content: space-around; }
        button { background: #ffdee9; border: 2px solid #ff85a1; padding: 10px; border-radius: 15px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🌸 Yishan 的樱花校园</h1>
    
    <div id="campus-scene">
        <div class="status-box">坐标: <span id="pos-x">50</span></div>
        <div id="princess">👸</div>
    </div>

    <div class="move-btns">
        <button class="ctrl-btn" onclick="move(-40)">⬅️</button>
        <button class="ctrl-btn" onclick="jump()">UP</button>
        <button class="ctrl-btn" onclick="move(40)">➡️</button>
    </div>

    <div class="panel">
        <button onclick="change('👩‍🎓')">换校服</button>
        <button onclick="eat()">去吃饭 🍱</button>
    </div>

    <script>
        let posX = 50;
        const princess = document.getElementById('princess');

        // 1. 左右移动功能
        function move(distance) {
            posX += distance;
            // 限制范围，不让公主走出校门
            if (posX < 0) posX = 0;
            if (posX > 500) posX = 500;
            
            princess.style.left = posX + "px";
            document.getElementById('pos-x').innerText = posX;

            // 走路时晃动一下
            princess.style.transform = "rotate(" + (distance > 0 ? 10 : -10) + "deg)";
            setTimeout(() => princess.style.transform = "rotate(0deg)", 200);
        }

        // 2. 跳跃功能
        function jump() {
            princess.style.bottom = "150px"; // 跳起来的高度
            setTimeout(() => {
                princess.style.bottom = "30px"; // 落地
            }, 300);
        }

        // 3. 换装
        function change(char) {
            princess.innerText = char;
        }

        // 4. 吃饭
        function eat() {
            princess.innerText = "😋";
            setTimeout(() => princess.innerText = "👩‍🎓", 1000);
        }

        // 5. 增加键盘控制
        window.addEventListener('keydown', (e) => {
            if (e.key === "ArrowLeft") move(-30);
            if (e.key === "ArrowRight") move(30);
            if (e.key === " " || e.key === "ArrowUp") jump();
        });
    </script>
</body>
</html>
