<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>🌸 樱花校园：全能公主</title>
    <style>
        body { margin: 0; background: #fff0f6; font-family: 'Arial', sans-serif; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
        
        /* 校园舞台 */
        #campus-scene { 
            width: 95%; max-width: 600px; height: 450px; 
            background: linear-gradient(180deg, #87CEEB 0%, #ffdee9 100%); 
            border: 8px solid #ff85a1; border-radius: 30px; 
            position: relative; margin: 10px; overflow: hidden;
        }

        /* 角色：平滑移动和跳跃 */
        #princess { 
            font-size: 80px; position: absolute; 
            bottom: 30px; left: 50px; 
            transition: left 0.2s, bottom 0.3s, transform 0.2s;
            user-select: none; z-index: 10;
        }

        /* 食物掉落特效 */
        #food-air { position: absolute; font-size: 50px; display: none; z-index: 5; }

        /* 操作面板 */
        .control-panel { 
            background: white; padding: 15px; border-radius: 20px; 
            width: 90%; max-width: 600px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .row { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; }
        
        /* 按钮样式 */
        button { 
            padding: 10px 15px; border-radius: 15px; border: 2px solid #ff85a1; 
            background: #ffdee9; color: #d63384; font-weight: bold; cursor: pointer; 
        }
        button:hover { background: #ff85a1; color: white; }
        .move-btn { background: #00d2ff; border-color: #0099cc; color: white; width: 60px; }
        .eat-btn { background: #ffc107; border-color: #e67e22; color: white; }
    </style>
</head>
<body>

    <h1>🌸 樱花校园：变身与开饭！</h1>
    
    <div id="campus-scene">
        <div style="position:absolute; left:20%; top:10%; animation: fall 5s infinite">🌸</div>
        <div style="position:absolute; left:70%; top:5%; animation: fall 7s infinite">🌸</div>
        
        <div id="princess">👸</div>
        <div id="food-air">🍱</div>
    </div>

    <div class="control-panel">
        <div class="row">
            <button class="move-btn" onclick="move(-40)">⬅️</button>
            <button class="move-btn" onclick="jump()">跳</button>
            <button class="move-btn" onclick="move(40)">➡️</button>
        </div>

        <div class="row">
            <span style="font-size:12px; align-self:center;">换装:</span>
            <button onclick="change('👸')">初始</button>
            <button onclick="change('👩‍🎓')">校服</button>
            <button onclick="change('👘')">和服</button>
            <button onclick="change('🧚‍♀️')">仙女</button>
        </div>

        <div class="row">
            <span style="font-size:12px; align-self:center;">开饭:</span>
            <button class="eat-btn" onclick="eat('🍱')">便当</button>
            <button class="eat-btn" onclick="eat('🍦')">甜筒</button>
            <button class="eat-btn" onclick="eat('🍰')">蛋糕</button>
        </div>
    </div>

    <script>
        let posX = 50;
        let isJumping = false;
        let currentLook = '👸';
        const princess = document.getElementById('princess');

        // 1. 走路逻辑
        function move(distance) {
            posX += distance;
            if (posX < 0) posX = 0;
            if (posX > 500) posX = 500;
            princess.style.left = posX + "px";
        }

        // 2. 跳跃逻辑
        function jump() {
            if (isJumping) return;
            isJumping = true;
            princess.style.bottom = "180px";
            setTimeout(() => {
                princess.style.bottom = "30px";
                isJumping = false;
            }, 300);
        }

        // 3. 换装逻辑 (直接改变变量和显示)
        function change(newLook) {
            currentLook = newLook;
            princess.innerText = currentLook;
            // 变身特效
            princess.style.transform = "scale(1.5)";
            setTimeout(() => princess.style.transform = "scale(1)", 200);
        }

        // 4. 吃饭逻辑
        function eat(foodEmoji) {
            // 展示食物掉落
            const food = document.getElementById('food-air');
            food.innerText = foodEmoji;
            food.style.left = (posX + 60) + "px";
            food.style.top = "100px";
            food.style.display = "block";
            
            // 食物掉到嘴里
            setTimeout(() => {
                food.style.top = "300px";
                food.style.transition = "top 0.5s";
            }, 10);

            // 公主吃掉食物的反应
            setTimeout(() => {
                food.style.display = "none";
                food.style.transition = "none";
                princess.innerText = "😋"; // 吃的时候变表情
                setTimeout(() => princess.innerText = currentLook, 800); // 吃完变回原来的装扮
            }, 500);
        }

        // 5. 键盘支持
        window.addEventListener('keydown', (e) => {
            if (e.key === "ArrowLeft") move(-30);
            if (e.key === "ArrowRight") move(30);
            if (e.key === " ") jump();
        });
    </script>

    <style>
        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); }
            100% { transform: translateY(500px) rotate(360deg); }
        }
    </style>
</body>
</html>
