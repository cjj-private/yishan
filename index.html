<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🌟 Yishan 的星际接宝游戏</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: Arial; }
        canvas { display: block; background: linear-gradient(to bottom, #000428, #004e92); }
        #ui { position: absolute; top: 20px; left: 20px; color: white; font-size: 24px; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">得分: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let score = 0;
        let basket = { x: canvas.width / 2, y: canvas.height - 70, width: 80, height: 20 };
        let stars = [];

        // 监听鼠标或手指移动
        window.addEventListener('mousemove', (e) => { basket.x = e.clientX - basket.width / 2; });
        window.addEventListener('touchmove', (e) => { 
            basket.x = e.touches[0].clientX - basket.width / 2; 
            e.preventDefault();
        }, {passive: false});

        function createStar() {
            stars.push({
                x: Math.random() * canvas.width,
                y: 0,
                size: Math.random() * 5 + 5,
                speed: Math.random() * 3 + 2
            });
        }

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 画篮子
            ctx.fillStyle = '#ffde59';
            ctx.fillRect(basket.x, basket.y, basket.width, basket.height);

            // 画星星
            for (let i = 0; i < stars.length; i++) {
                let s = stars[i];
                s.y += s.speed;

                // 修改后的代码：画一只小兔子
                ctx.font = s.size * 3 + "px Arial"; 
                ctx.fillText("🐰", s.x, s.y);

                // 碰撞检测
                if (s.y + s.size > basket.y && s.x > basket.x && s.x < basket.x + basket.width) {
                    stars.splice(i, 1);
                    score += 10;
                    scoreElement.innerText = score;
                } else if (s.y > canvas.height) {
                    stars.splice(i, 1);
                }
            }

            if (Math.random() < 0.05) createStar();
            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>
