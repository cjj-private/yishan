<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>🎸 K-Pop 猎手：公主出击</title>
    <style>
        body { margin: 0; background: #0c001a; font-family: 'Arial', sans-serif; color: white; display: flex; flex-direction: column; align-items: center; }
        
        /* 战斗舞台 */
        #battle-zone { width: 90%; max-width: 500px; height: 350px; background: url('https://www.transparenttextures.com/patterns/dark-matter.png'), linear-gradient(180deg, #1a0033 0%, #4b0082 100%); border: 4px solid #00d2ff; border-radius: 20px; position: relative; margin: 20px; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 0 20px #00d2ff; }

        /* 公主和怪兽 */
        .character { font-size: 80px; position: relative; transition: 0.1s; cursor: pointer; user-select: none; }
        .monster { font-size: 100px; filter: drop-shadow(0 0 10px red); }
        .monster:active { transform: scale(0.9) rotate(5deg); } /* 点击抖动效果 */

        /* 血条 */
        .hp-bar { position: absolute; top: -30px; width: 100px; height: 10px; background: #333; border-radius: 5px; overflow: hidden; border: 2px solid white; }
        #monster-hp { background: #ff0000; width: 100%; height: 100%; transition: 0.3s; }

        /* 换装面板 */
        #controls { background: rgba(255, 255, 255, 0.1); padding: 15px; border-radius: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        button { background: #00d2ff; color: #000; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        button:hover { background: #ff00cc; color: white; }

        #log { margin-top: 10px; font-size: 18px; color: #ffeb3b; height: 24px; }
    </style>
</head>
<body>

    <h1>✨ K-Pop 猎手：打怪兽时间！</h1>
    <p>点击右边的【大怪兽】来发动攻击！</p>

    <div id="battle-zone">
        <div class="character">
            <div id="p-aura" style="position:absolute; font-size:120px; opacity:0.3; top:-20px; left:-20px">✨</div>
            <div id="p-body">👸</div>
            <div id="p-weapon" style="position:absolute; font-size:40px; bottom:0; right:-20px">🎤</div>
        </div>

        <div class="character monster" onclick="attackMonster()">
            <div class="hp-bar"><div id="monster-hp"></div></div>
            <div id="m-body">👾</div>
        </div>
    </div>

    <div id="log">准备战斗！🎤</div>

    <div id="controls">
        <button onclick="changeOutfit('🦊', '⚔️', '🔥')">九尾狐猎手</button>
        <button onclick="changeOutfit('👸', '🎸', '⚡')">摇滚公主</button>
        <button onclick="changeOutfit('👧', '🏹', '🌸')">极光少女</button>
    </div>

    <script>
        let hp = 100;
        const monsters = ['👾', '👹', '🐉', '👻', '🧟'];

        function attackMonster() {
            if (hp <= 0) return;

            // 扣血逻辑
            hp -= 10;
            document.getElementById('monster-hp').style.width = hp + "%";
            document.getElementById('log').innerText = "💥 击中怪兽！HP -10";

            // 击败逻辑
            if (hp <= 0) {
                document.getElementById('log').innerText = "🏆 恭喜！怪兽被击败了！";
                document.getElementById('m-body').innerText = "💨";
                setTimeout(nextMonster, 1500); // 1.5秒后出现新怪兽
            }
        }

        function nextMonster() {
            hp = 100;
            document.getElementById('monster-hp').style.width = "100%";
            document.getElementById('m-body').innerText = monsters[Math.floor(Math.random() * monsters.length)];
            document.getElementById('log').innerText = "注意！新怪兽出现了！";
        }

        function changeOutfit(body, weapon, aura) {
            document.getElementById('p-body').innerText = body;
            document.getElementById('p-weapon').innerText = weapon;
            document.getElementById('p-aura').innerText = aura;
            document.getElementById('log').innerText = "换装成功！战斗力提升！";
        }
    </script>
</body>
</html>
