<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>🌸 樱花校园：全能公主</title>
    <style>
        body { margin: 0; background: #fff0f6; font-family: 'Arial', sans-serif; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
        
        /* 校园舞台 */
        #campus-scene { 
            width: 95%; max-width: 600px; height: 450px; 
            background: linear-gradient(180deg, #87CEEB 0%, #ffdee9 100%); 
            border: 8px solid #ff85a1; border-radius: 30px; 
            position: relative; margin: 10px; overflow: hidden;
        }

        /* 角色容器：包含头和身体 */
        #character-container { 
            position: absolute; bottom: 30px; left: 50px; 
            width: 120px; height: 180px;
            display: flex; flex-direction: column; align-items: center;
            transition: left 0.2s, bottom 0.3s, transform 0.2s;
            user-select: none; z-index: 10;
        }

        /* 用代码画的双马尾头像 */
        #head-drawing {
            width: 100px; height: 100px; position: relative; z-index: 2; margin-bottom: -15px; transition: transform 0.3s;
        }
        /* 头发 */
        .hair { position: absolute; background: #7c4e34; border-radius: 50%; }
        .hair-main { width: 90px; height: 80px; left: 5px; top: 10px; }
        .bangs { width: 60px; height: 30px; left: 20px; top: 15px; border-radius: 0 0 30px 30px; z-index: 3; }
        .pigtail { width: 40px; height: 60px; top: 20px; }
        .pigtail.left { left: -20px; transform: rotate(-20deg); }
        .pigtail.right { right: -20px; transform: rotate(20deg); }
        /* 樱花发饰 */
        .flower { position: absolute; font-size: 20px; color: #ffb7c5; z-index: 4; }
        /* 脸 */
        .face { position: absolute; width: 70px; height: 75px; background: #ffe0bd; border-radius: 50%; left: 15px; top: 25px; z-index: 1; border: 2px solid #7c4e34; }
        /* 眼睛和嘴巴 */
        .eye { position: absolute; width: 8px; height: 12px; background: #333; border-radius: 50%; top: 30px; z-index: 5; }
        .eye.left { left: 20px; }
        .eye.right { right: 20px; }
        .mouth { position: absolute; width: 20px; height: 10px; border: 2px solid #e94560; border-radius: 0 0 10px 10px; border-top: none; left: 25px; top: 50px; z-index: 5; }

        /* 衣服：点击按钮会变 */
        #outfit { font-size: 100px; line-height: 1; z-index: 1; position: relative; }

        /* 食物掉落 */
        #food-air { position: absolute; font-size: 50px; display: none; z-index: 15; }

        /* 操作面板 */
        .control-panel { 
            background: white; padding: 15px; border-radius: 20px; 
            width: 90%; max-width: 600px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .row { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .label { font-size: 12px; color: #ff85a1; font-weight: bold; width: 100%; text-align: center; margin-bottom: 5px; }
        
        /* 按钮样式 */
        button { 
            padding: 10px 15px; border-radius: 15px; border: 2px solid #ff85a1; 
            background: #ffdee9; color: #d63384; font-weight: bold; cursor: pointer; font-size: 14px;
        }
        button:hover { background: #ff85a1; color: white; }
        .move-btn { background: #00d2ff; border-color: #0099cc; color: white; width: 60px; }
        .eat-btn { background: #ffc107; border-color: #e67e22; color: white; }
    </style>
</head>
<body>

    <h1>🌸 一闪的樱花校园舞台</h1>
    
    <div id="campus-scene">
        <div style="position:absolute; left:20%; top:-50px; animation: fall 5s infinite; font-size: 20px; color: #ffb7c5;">🌸</div>
        <div style="position:absolute; left:70%; top:-50px; animation: fall 7s infinite; font-size: 20px; color: #ffb7c5;">🌸</div>
        
        <div id="character-container">
            <div id="head-drawing">
                <div class="hair hair-main"></div>
                <div class="hair bangs"></div>
                <div class="hair pigtail left"></div>
                <div class="hair pigtail right"></div>
                <div class="flower" style="left: 0px; top: 10px;">🌸</div>
                <div class="flower" style="right: 0px; top: 10px;">🌸</div>
                <div class="face">
                    <div class="eye left"></div>
                    <div class="eye right"></div>
                    <div class="mouth"></div>
                </div>
            </div>
            <div id="outfit">👗</div> 
        </div>

        <div id="food-air">🍱</div>
    </div>

    <div class="control-panel">
        <div class="row">
            <button class="move-btn" onclick="move(-40)">⬅️</button>
            <button class="move-btn" onclick="jump()">跳</button>
            <button class="move-btn" onclick="move(40)">➡️</button>
        </div>

        <div class="label">👗 校服衣橱</div>
        <div class="row">
            <button onclick="changeOutfit('👗')">初始裙子</button>
            <button onclick="changeOutfit('👚')">运动校服</button>
            <button onclick="changeOutfit('👘')">樱花和服</button>
            <button onclick="changeOutfit('🧚‍♀️')">仙女变身</button>
        </div>

        <div class="label">🍱 校园食堂</div>
        <div class="row">
            <button class="eat-btn" onclick="eat('🍱')">吃便当</button>
            <button class="eat-btn" onclick="eat('🍦')">吃甜筒</button>
            <button class="eat-btn" onclick="eat('🍰')">吃蛋糕</button>
        </div>
    </div>

    <script>
        let posX = 50;
        let isJumping = false;
        let currentLook = '👸'; // 用于换装后恢复表情
        const container = document.getElementById('character-container');
        const outfit = document.getElementById('outfit');
        const head = document.getElementById('head-drawing');

        // 1. 走路逻辑
        function move(distance) {
            posX += distance;
            if (posX < 0) posX = 0;
            if (posX > 480) posX = 480;
            container.style.left = posX + "px";
            // 走路时身体微微晃动
            container.style.transform = "rotate(" + (distance > 0 ? 5 : -5) + "deg)";
            setTimeout(() => container.style.transform = "rotate(0deg)", 200);
        }

        // 2. 跳跃逻辑
        function jump() {
            if (isJumping) return;
            isJumping = true;
            container.style.bottom = "180px";
            setTimeout(() => { container.style.bottom = "30px"; isJumping = false; }, 300);
        }

        // 3. 换装逻辑：只变outfit，不变头
        function changeOutfit(newOutfit) {
            outfit.innerText = newOutfit;
            // 变身特效：头和身体一起缩放
            container.style.transform = "scale(1.2)";
            setTimeout(() => container.style.transform = "scale(1)", 200);
        }

        // 4. 吃饭逻辑：吃饭功能回来了！
        function eat(foodEmoji) {
            // 展示食物掉落
            const food = document.getElementById('food-air');
            food.innerText = foodEmoji;
            food.style.left = (posX + 50) + "px"; // 食物出现在公主旁边
            food.style.top = "50px";
            food.style.display = "block";
            food.style.transition = "none";
            
            // 食物掉到嘴里
            setTimeout(() => {
                food.style.top = "250px";
                food.style.transition = "top 0.5s ease-in";
            }, 50);

            // 公主吃掉食物的反应
            setTimeout(() => {
                food.style.display = "none";
                // 头像开心得晃动一下
                head.style.transform = "scale(1.2) rotate(15deg)";
                setTimeout(() => head.style.transform = "scale(1) rotate(0deg)", 500);
            }, 550);
        }

        // 5. 键盘支持
        window.addEventListener('keydown', (e) => {
            if (e.key === "ArrowLeft") move(-30);
            if (e.key === "ArrowRight") move(30);
            if (e.key === " ") jump();
        });
    </script>

    <style>
        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
            100% { transform: translateY(500px) rotate(360deg); opacity: 0.7; }
        }
    </style>
</body>
</html>
