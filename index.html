<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>🌸 樱花校园：公主的一天</title>
    <style>
        body { margin: 0; background: #fff0f6; font-family: 'Arial', sans-serif; display: flex; flex-direction: column; align-items: center; }
        
        /* 樱花背景舞台 */
        #campus-scene { 
            width: 90%; max-width: 500px; height: 400px; 
            background: linear-gradient(180deg, #87CEEB 0%, #ffdee9 100%); 
            border: 8px solid #ff85a1; border-radius: 30px; 
            position: relative; margin: 20px; 
            box-shadow: 0 10px 20px rgba(255, 133, 161, 0.3);
            overflow: hidden;
        }

        /* 飘落的樱花特效 */
        .sakura { position: absolute; color: #ffb7c5; font-size: 20px; animation: fall 5s linear infinite; }
        @keyframes fall { to { transform: translateY(400px) rotate(360deg); } }

        /* 角色 */
        #princess { font-size: 100px; position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); transition: 0.3s; }
        #food-item { font-size: 50px; position: absolute; bottom: 80px; left: 65%; display: none; }

        /* 状态条 */
        .status-box { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.7); padding: 10px; border-radius: 15px; color: #d63384; font-weight: bold; }
        #energy-bar { width: 100px; height: 10px; background: #eee; border-radius: 5px; margin-top: 5px; border: 1px solid #ff85a1; }
        #energy-fill { width: 50%; height: 100%; background: #ff85a1; transition: 0.5s; }

        /* 面板 */
        .panel { background: white; padding: 15px; border-radius: 20px; width: 90%; max-width: 500px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .tab-title { font-size: 14px; color: #ff85a1; font-weight: bold; margin-bottom: 10px; border-left: 4px solid #ff85a1; padding-left: 10px; }
        
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        button { background: #ffdee9; color: #d63384; border: 2px solid #ff85a1; padding: 8px 15px; border-radius: 15px; cursor: pointer; font-weight: bold; }
        button:hover { background: #ff85a1; color: white; }
        .eat-btn { background: #ffc107; border-color: #e67e22; color: #fff; }
    </style>
</head>
<body>

    <h1>🌸 樱花校园 (Sakura Campus)</h1>
    
    <div id="campus-scene">
        <div class="status-box">
            能量值: <span id="energy-num">50</span>%
            <div id="energy-bar"><div id="energy-fill"></div></div>
        </div>
        
        <div class="sakura" style="left: 10%; animation-delay: 0s;">🌸</div>
        <div class="sakura" style="left: 40%; animation-delay: 2s;">🌸</div>
        <div class="sakura" style="left: 80%; animation-delay: 1s;">🌸</div>

        <div id="princess">👸</div>
        <div id="food-item">🍱</div>
    </div>

    <div class="panel">
        <div class="tab-title">👗 校服/换装</div>
        <div class="btn-group">
            <button onclick="change('👸')">经典公主</button>
            <button onclick="change('👩‍🎓')">樱花校服</button>
            <button onclick="change('👘')">传统和服</button>
            <button onclick="change('🎀')">可爱蝴蝶结</button>
        </div>

        <div class="tab-title">🍱 校园食堂 (吃饭)</div>
        <div class="btn-group">
            <button class="eat-btn" onclick="eat('🍱')">吃便当</button>
            <button class="eat-btn" onclick="eat('🍜')">吃拉面</button>
            <button class="eat-btn" onclick="eat('🍦')">吃冰淇淋</button>
            <button class="eat-btn" onclick="eat('🍰')">吃蛋糕</button>
        </div>
    </div>

    <script>
        let energy = 50;

        // 换装功能
        function change(char) {
            document.getElementById('princess').innerText = char;
            // 换装也会消耗一点点能量哦
            updateEnergy(-5);
        }

        // 吃饭功能
        function eat(food) {
            if (energy >= 100) {
                alert("太饱了，吃不下啦！🌸");
                return;
            }

            // 显示食物
            const foodEl = document.getElementById('food-item');
            foodEl.innerText = food;
            foodEl.style.display = 'block';
            
            // 吃饭动画
            document.getElementById('princess').style.transform = 'translateX(-70%) scale(1.1)';
            
            setTimeout(() => {
                foodEl.style.display = 'none';
                document.getElementById('princess').style.transform = 'translateX(-50%) scale(1)';
                updateEnergy(20); // 吃饭增加
