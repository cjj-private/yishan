<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>🌸 樱花校园：一闪的专属变身</title>
    <style>
        body { margin: 0; background: #fff0f6; font-family: 'Arial', sans-serif; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
        
        #campus-scene { 
            width: 95%; max-width: 600px; height: 450px; 
            background: linear-gradient(180deg, #87CEEB 0%, #ffdee9 100%); 
            border: 8px solid #ff85a1; border-radius: 30px; 
            position: relative; margin: 10px; overflow: hidden;
        }

        /* 角色容器 */
        #character-container { 
            position: absolute; bottom: 30px; left: 50px; 
            width: 150px; height: 200px;
            display: flex; flex-direction: column; align-items: center;
            transition: left 0.2s, bottom 0.3s, transform 0.2s;
            z-index: 10;
        }

        /* 专属头像：使用你提供的图片 */
        #head-img { 
            width: 120px; height: 120px; 
            object-fit: contain; 
            z-index: 2; 
            margin-bottom: -35px; /* 让头和衣服接在一起 */
        }

        /* 衣服 */
        #outfit { font-size: 100px; line-height: 1; z-index: 1; }

        /* 食物 */
        #food-air { position: absolute; font-size: 50px; display: none; z-index: 15; }

        .control-panel { background: white; padding: 15px; border-radius: 20px; width: 90%; max-width: 600px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .row { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .label { font-size: 14px; color: #ff85a1; font-weight: bold; width: 100%; text-align: center; margin-bottom: 5px; }
        
        button { padding: 10px 15px; border-radius: 15px; border: 2px solid #ff85a1; background: #ffdee9; color: #d63384; font-weight: bold; cursor: pointer; }
        button:hover { background: #ff85a1; color: white; }
        .move-btn { background: #00d2ff; border-color: #0099cc; color: white; min-width: 60px; }
        .eat-btn { background: #fff3cd; border-color: #ffc107; color: #856404; }
    </style>
</head>
<body>

    <h1>🌸 樱花校园：一闪公主版</h1>
    
    <div id="campus-scene">
        <div style="position:absolute; left:10%; top:-50px; animation: fall 5s infinite">🌸</div>
        <div style="position:absolute; left:80%; top:-50px; animation: fall 7s infinite">🌸</div>
        
        <div id="character-container">
            <img id="head-img" src="https://raw.githubusercontent.com/cjj-private/yishan/main/image_f6ba82.png" alt="head">
            <div id="outfit">👗</div>
        </div>

        <div id="food-air">🍔</div>
    </div>

    <div class="control-panel">
        <div class="row">
            <button class="move-btn" onclick="move(-40)">⬅️</button>
            <button class="move-btn" onclick="jump()">跳跃</button>
            <button class="move-btn" onclick="move(40)">➡️</button>
        </div>

        <div class="label">👗 换衣服</div>
        <div class="row">
            <button onclick="changeOutfit('👗')">经典</button>
            <button onclick="changeOutfit('👘')">和服</button>
            <button onclick="changeOutfit('🥋')">校服</button>
            <button onclick="changeOutfit('🧚‍♀️')">仙女</button>
        </div>

        <div class="label">🍔 餐厅菜单</div>
        <div class="row">
            <button class="eat-btn" onclick="eat('🍔')">汉堡</button>
            <button class="eat-btn" onclick="eat('🍊')">橙汁</button>
            <button class="eat-btn" onclick="eat('🍖')">BBQ</button>
            <button class="eat-btn" onclick="eat('🍰')">蛋糕</button>
        </div>
    </div>

    <script>
        let posX = 50;
        let isJumping = false;
        const container = document.getElementById('character-container');
        const headImg = document.getElementById('head-img');
        const outfit = document.getElementById('outfit');

        function move(distance) {
            posX += distance;
            if (posX < 0) posX = 0;
            if (posX > 450) posX = 450;
            container.style.left = posX + "px";
        }

        function jump() {
            if (isJumping) return;
            isJumping = true;
            container.style.bottom = "180px";
            setTimeout(() => { container.style.bottom = "30px"; isJumping = false; }, 300);
        }

        function changeOutfit(newClothes) {
            outfit.innerText = newClothes;
            container.style.transform = "scale(1.1)";
            setTimeout(() => container.style.transform = "scale(1)", 200);
        }

        function eat(foodEmoji) {
            const food = document.getElementById('food-air');
            food.innerText = foodEmoji;
            food.style.left = (posX + 50) + "px";
            food.style.top = "50px";
            food.style.display = "block";
            
            setTimeout(() => {
                food.style.top = "250px";
                food.style.transition = "top 0.5s ease-in";
            }, 50);

            setTimeout(() => {
                food.style.display = "none";
                food.style.transition = "none";
                // 吃饭时头像晃动一下，表示开心
                headImg.style.transform = "rotate(15deg) scale(1.2)";
                setTimeout(() => headImg.style.transform = "rotate(0deg) scale(1)", 500);
            }, 550);
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === "ArrowLeft") move(-30);
            if (e.key === "ArrowRight") move(30);
            if (e.key === " ") jump();
        });
    </script>

    <style>
        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
            100% { transform: translateY(500px) rotate(360deg); opacity: 0.6; }
        }
    </style>
</body>
</html>
