<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>🌸 一闪的专属：超萌樱花校园</title>
    <style>
        body { margin: 0; background: #fff0f6; font-family: 'Arial', sans-serif; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
        
        h1 { color: #d63384; margin-top: 10px; font-size: 24px; text-shadow: 1px 1px 2px rgba(255,133,161,0.5); }

        /* 校园舞台 */
        #campus-scene { 
            width: 95%; max-width: 600px; height: 520px; 
            background: linear-gradient(180deg, #87CEEB 0%, #ffdee9 100%); 
            border: 8px solid #ff85a1; border-radius: 30px; 
            position: relative; margin: 10px 0; overflow: hidden;
            box-shadow: 0 10px 20px rgba(255, 133, 161, 0.3);
        }

        /* 角色容器：平滑移动和跳跃 */
        #character-container { 
            position: absolute; bottom: 30px; left: 50px; 
            width: 160px; height: 230px;
            display: flex; flex-direction: column; align-items: center;
            transition: left 0.2s, bottom 0.3s, transform 0.2s;
            user-select: none; z-index: 10;
        }

        /* 可靠精美的头像图层 */
        #head-img { 
            width: 140px; height: 140px; 
            z-index: 2; margin-bottom: -35px; /* 让头和衣服接在一起 */
            object-fit: contain; /* 确保图片不被拉伸 */
            transition: transform 0.3s;
        }

        /* 衣服：点击按钮会变 */
        #outfit { font-size: 110px; line-height: 1; z-index: 1; position: relative; }

        /* 食物掉落 */
        #food-air { position: absolute; font-size: 60px; display: none; z-index: 15; text-shadow: 0 0 10px rgba(255,255,255,0.5); }

        /* 操作面板 */
        .control-panel { 
            background: white; padding: 15px; border-radius: 20px; 
            width: 90%; max-width: 600px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .row { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .label { font-size: 12px; color: #ff85a1; font-weight: bold; width: 100%; text-align: center; margin-bottom: 5px; }
        
        /* 按钮样式 */
        button { 
            padding: 10px 18px; border-radius: 15px; border: 2px solid #ff85a1; 
            background: #ffdee9; color: #d63384; font-weight: bold; cursor: pointer; font-size: 15px;
            transition: 0.2s;
        }
        button:hover { background: #ff85a1; color: white; transform: scale(1.05); }
        .move-btn { background: #00d2ff; border-color: #0099cc; color: white; min-width: 65px; }
        .eat-btn { background: #fff3cd; border-color: #ffc107; color: #856404; }
    </style>
</head>
<body>

    <h1>🌸 一闪的专属：漂亮双马尾校园公主</h1>
    
    <div id="campus-scene">
        <div style="position:absolute; left:15%; top:-50px; animation: fall 6s infinite; font-size: 20px; color: #ffb7c5;">🌸</div>
        <div style="position:absolute; left:80%; top:-50px; animation: fall 8s infinite; font-size: 20px; color: #ffb7c5;">🌸</div>
        
        <div id="character-container">
            <img id="head-img" src="image_7.png" alt="公主头像">
            <div id="outfit">👗</div> </div>

        <div id="food-air">🍱</div>
    </div>

    <div class="control-panel">
        <div class="row">
            <button class="move-btn" onclick="move(-40)">⬅️</button>
            <button class="move-btn" onclick="jump()">跳</button>
            <button class="move-btn" onclick="move(40)">➡️</button>
        </div>

        <div class="label">👗 选择新校服</div>
        <div class="row">
            <button onclick="changeOutfit('👗')">经典裙</button>
            <button onclick="changeOutfit('👚')">运动服</button>
            <button onclick="changeOutfit('👘')">樱花和服</button>
            <button onclick="changeOutfit('🧚‍♀️')">仙女裙</button>
        </div>

        <div class="label">🍱 校园食堂</div>
        <div class="row">
            <button class="eat-btn" onclick="eat('🍱')">吃便当</button>
            <button class="eat-btn" onclick="eat('🍦')">吃甜筒</button>
            <button class="eat-btn" onclick="eat('🍰')">吃蛋糕</button>
        </div>
    </div>

    <script>
        let posX = 50;
        let isJumping = false;
        const container = document.getElementById('character-container');
        const outfit = document.getElementById('outfit');
        const headImg = document.getElementById('head-img');

        // 1. 走路逻辑
        function move(distance) {
            posX += distance;
            if (posX < 0) posX = 0;
            if (posX > 440) posX = 440; // 限制右边边界
            container.style.left = posX + "px";
        }

        // 2. 跳跃逻辑
        function jump() {
            if (isJumping) return;
            isJumping = true;
            container.style.bottom = "200px"; // 跳跃高度
            setTimeout(() => {
                container.style.bottom = "30px";
                isJumping = false;
            }, 300);
        }

        // 3. 换装逻辑：身体变，头不变
        function changeOutfit(newOutfit) {
            outfit.innerText = newOutfit;
            // 变身特效：整个角色缩放
            container.style.transform = "scale(1.2)";
            setTimeout(() => container.style.transform = "scale(1)", 200);
        }

        // 4. 吃饭逻辑：吃饭按钮清晰可见
        function eat(foodEmoji) {
            // 展示食物掉落
            const food = document.getElementById('food-air');
            food.innerText = foodEmoji;
            food.style.left = (posX + 60) + "px";
            food.style.top = "50px";
            food.style.display = "block";
            food.style.transition = "none";
            
            // 食物掉到嘴里
            setTimeout(() => {
                food.style.top = "300px";
                food.style.transition = "top 0.5s cubic-bezier(0.47, 0, 0.74, 0.71)"; 
            }, 50);

            // 公主吃掉食物的反应
            setTimeout(() => {
                food.style.display = "none";
                // 头像开心得晃动和歪头
                headImg.style.transform = "rotate(15deg) scale(1.2)";
                setTimeout(() => {
                    headImg.style.transform = "rotate(0deg) scale(1)";
                }, 800);
            }, 550);
        }

        // 5. 键盘支持
        window.addEventListener('keydown', (e) => {
            if (e.key === "ArrowLeft") move(-30);
            if (e.key === "ArrowRight") move(30);
            if (e.key === " ") jump();
        });
    </script>

    <style>
        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
            100% { transform: translateY(570px) rotate(360deg); opacity: 0.6; }
        }
    </style>
</body>
</html>
